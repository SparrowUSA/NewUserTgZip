name: Vault-Tree-Service

on:
  workflow_dispatch: # Manual start
  schedule:
    - cron: '0 */6 * * *' # Auto-start every 6 hours
  push:
    branches: [ main ] # Start on code updates

jobs:
  run-vault-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Shuts down just before the 6-hour GitHub limit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Increase Swap Space (For 2GB+ ZIPs)
        run: |
          sudo fallocate -l 2G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Vault Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_LIBRARY_ID: ${{ secrets.BUNNY_LIBRARY_ID }}
        run: python main.py
