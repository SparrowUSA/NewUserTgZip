name: Vault-Tree-Service

on:
  workflow_dispatch: # Allows manual start from the Actions tab
  schedule:
    - cron: '0 */6 * * *' # Auto-starts every 6 hours
  push:
    branches: [ main ] # Starts when you push code

jobs:
  run-vault-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 350 # Stops just before the 6-hour GitHub limit

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip'

      - name: Cleanup and Optimize Disk
        # This clears pre-installed tools we don't need to give you 
        # the maximum possible space for your 2GB ZIPs.
        run: |
          sudo rm -rf /usr/share/dotnet
          sudo rm -rf /opt/ghc
          sudo rm -rf "/usr/local/share/boost"
          sudo rm -rf "$AGENT_TOOLSDIRECTORY"

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements.txt ]; then pip install -r requirements.txt; fi

      - name: Run Vault Bot
        env:
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_LIBRARY_ID: ${{ secrets.BUNNY_LIBRARY_ID }}
        run: python main.py
