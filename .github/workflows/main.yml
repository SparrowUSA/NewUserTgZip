name: Vault-Tree-Service

on:
  workflow_dispatch: # Allows you to start the bot manually from the Actions tab
  push:
    branches: [ main ] # Starts the bot whenever you push code updates

jobs:
  run-vault-bot:
    runs-on: ubuntu-latest
    # Set a generous timeout (GitHub's max is 6 hours)
    timeout-minutes: 360 

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'
          cache: 'pip' # Speeds up future runs

      - name: Increase Swap Space
        # This helps with unzipping huge 2GB+ files if RAM gets tight
        run: |
          sudo fallocate -l 2G /swapfile
          sudo chmod 600 /swapfile
          sudo mkswap /swapfile
          sudo swapon /swapfile

      - name: Install Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install telethon aiohttp requests python-dotenv

      - name: Run Vault Bot
        env:
          # These must be added in GitHub Repository Settings -> Secrets
          API_ID: ${{ secrets.API_ID }}
          API_HASH: ${{ secrets.API_HASH }}
          SESSION: ${{ secrets.SESSION }}
          BUNNY_STREAM_API_KEY: ${{ secrets.BUNNY_STREAM_API_KEY }}
          BUNNY_LIBRARY_ID: ${{ secrets.BUNNY_LIBRARY_ID }}
        run: python main.py
